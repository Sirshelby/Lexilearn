[project]
name = "lexilearn-api"
version = "1.1.0"
description = "Backend for LexiLearn, a reading tutor for learners with dyslexia"
requires-python = ">=3.12"
# The single list of runtime dependencies. Vercel, Docker and CI all install
# from this file and uv.lock, so versions can't drift between them.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.3",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "aiosqlite==0.22.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "pyjwt==2.7.0",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "tzdata>=2024.1",
]

# An extra rather than a dependency group, so deployments never install it.
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.vercel.scripts]
# Runs on Vercel after dependencies are installed, before the deployment goes
# live. It applies database migrations (see the script for when it skips).
build = "python scripts/vercel_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
