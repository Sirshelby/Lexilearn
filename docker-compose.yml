# Runs the whole app in containers. (For Vercel, see docs/DEPLOYING.md.)
#   cp .env.example .env   (then fill in SECRET_KEY and POSTGRES_PASSWORD)
#   docker compose up --build
# Then open http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lexilearn
      POSTGRES_USER: lexilearn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexilearn -d lexilearn"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lexilearn:${POSTGRES_PASSWORD}@db:5432/lexilearn
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
